<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reporte del jefe · Paradise Owner</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PP Owner">
<link rel="manifest" href="manifest-dueno.json">
<link rel="apple-touch-icon" href="IMG_0477.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--g:#c9a45a;--gl:#f6dc92;--gd:#8a6420;--t:#f2e6cf;--m:#8d7d62;--card:#151413;--bd:#4a3f2c;--bg:#0b0b0c;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--t);font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
/* Enredaderas a los lados */
.vine{position:fixed;top:0;bottom:0;width:60px;z-index:0;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%;opacity:.92}
.vine.l{left:0;background-image:url(IMG_0624.png),url(enredadera-izq.png)}
.vine.r{right:0;background-image:url(IMG_0625.png),url(enredadera-der.png)}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 45% at 50% 0%,rgba(201,164,90,.16),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(209,15,31,.10),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 62px calc(env(safe-area-inset-bottom,0px) + 30px)}
@media (min-width:640px){.wrap{padding-left:20px;padding-right:20px}}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--g);padding:7px 12px;border:1px solid var(--bd);border-radius:99px;background:rgba(21,20,19,.8)}
.hd{text-align:center;margin-top:6px}
.hd img{width:150px;height:auto;filter:drop-shadow(0 6px 18px rgba(201,164,90,.25))}
.hd .ttl{font-size:11px;letter-spacing:4px;font-weight:800;color:var(--g);margin-top:6px}
.hd .dt{font-size:13px;color:var(--m);margin-top:4px}
.hero{margin-top:16px;border-radius:22px;padding:18px;text-align:center;color:#0b0b0c;background:linear-gradient(160deg,var(--gl),var(--g) 50%,var(--gd));position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(201,164,90,.18)}
.hero::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-60%);animation:shine 3.6s ease-in-out 1s infinite}
@keyframes shine{0%{transform:translateX(-60%)}45%,100%{transform:translateX(60%)}}
.hero .k{font-size:11px;letter-spacing:3px;font-weight:800}
.hero .v{font-size:clamp(40px,13vw,52px);font-weight:800;line-height:1.05;margin:6px 0;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:#0b0b0c;color:var(--gl);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:800}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;min-width:0}
.box .k{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--g)}
.box .v{font-size:22px;font-weight:800;margin-top:3px;line-height:1.1;overflow-wrap:break-word;hyphens:auto}.box .v.sm{font-size:19px}.box .v.xs{font-size:16px}
.box .s{font-size:12px;color:var(--m)}
.card{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px 15px}
.card h3{font-size:13px;font-weight:800;margin-bottom:4px}
.suc{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #3a3226;font-size:15px}
.suc:last-child{border-bottom:0}.suc b{font-weight:800;font-variant-numeric:tabular-nums}
.suc .bar{height:4px;border-radius:9px;background:linear-gradient(90deg,var(--gd),var(--gl));margin-top:5px;width:0;transition:width 1.1s cubic-bezier(.16,1,.3,1)}
.none{font-size:14px;color:var(--m);padding:6px 0}
.mes{display:flex;justify-content:space-between;align-items:flex-end}
.mes .k{font-size:10.5px;letter-spacing:3px;font-weight:800;color:var(--g)}
.mes .v{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.mes .p{font-size:28px;font-weight:800;color:var(--g)}
.prog{height:12px;border-radius:99px;background:#2a2620;margin:10px 0 8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gd),var(--gl));transition:width 1.4s cubic-bezier(.16,1,.3,1) .3s}
.ln{font-size:13px;opacity:.85;line-height:1.5}
.ln b{color:var(--t)}
.cta{display:block;text-align:center;margin:18px auto 0;width:max-content;text-decoration:none;color:#0b0b0c;font-weight:800;font-size:15px;padding:13px 26px;border-radius:99px;background:linear-gradient(160deg,var(--gl),var(--g));box-shadow:0 8px 22px rgba(201,164,90,.25)}
.hist{margin-top:18px}
.hist h4{font-size:10.5px;letter-spacing:3px;font-weight:800;color:var(--g);text-align:center;margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;justify-content:flex-start}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:0 0 auto;padding:7px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-size:12.5px;font-weight:700;color:var(--t);white-space:nowrap}
.chip[aria-pressed=true]{background:linear-gradient(160deg,var(--gl),var(--g));color:#0b0b0c;border-color:transparent}
.foot{text-align:center;font-size:11.5px;color:var(--m);margin-top:16px}
.foot b{color:var(--g)}
.empty{text-align:center;margin-top:40px}
.empty .e{font-size:46px}
.empty b{display:block;font-size:19px;margin-top:8px}
.empty span{display:block;font-size:14px;color:var(--m);margin-top:6px;line-height:1.45}
.in{opacity:0;transform:translateY(14px);animation:in .7s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}.hero::after{display:none}.prog i,.suc .bar{transition:none}}
</style>
</head>
<body>
<div class="glow"></div>
<div class="vine l"></div><div class="vine r"></div>
<main class="wrap" id="app"></main>
<script>
(function(){
  var K='pp-reportes',app=document.getElementById('app');
  var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function $(t){var d=document.createElement('div');d.innerHTML=t;return d.firstElementChild}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function din(n){n=Math.round(+n||0);return '$'+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
  function fl(s){return s?(+s.slice(8))+' de '+MES[+s.slice(5,7)-1]:''}
  function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
  function leer(){try{return JSON.parse(localStorage.getItem(K)||'[]')||[]}catch(e){return []}}
  function guardar(l){try{localStorage.setItem(K,JSON.stringify(l.slice(0,14)))}catch(e){}}
  function decode(b){
    b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return JSON.parse(window.TextDecoder?new TextDecoder().decode(u):decodeURIComponent(escape(bin)));
  }
  var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function contar(el,n){n=+n||0;if(calm){el.textContent=din(n);return}var t0=null,D=1100;
    function st(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/D);el.textContent=din(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)}requestAnimationFrame(st)}

  // 1) Reporte que viene en la notificación (#d=...)
  var lista=leer(),nuevo=null,m=location.hash.match(/[#&]d=([A-Za-z0-9_\-+/=]+)/);
  if(m){try{nuevo=decode(m[1])}catch(e){nuevo=null}}
  if(nuevo&&nuevo.f){
    lista=lista.filter(function(r){return !(r.f===nuevo.f&&r.c===nuevo.c)});
    lista.unshift(nuevo);lista.sort(function(a,b){return (b.f+(b.c==='hoy'?'1':'0'))<(a.f+(a.c==='hoy'?'1':'0'))?-1:1});
    guardar(lista);
    try{history.replaceState(null,'',location.pathname)}catch(e){}
  }

  function pintar(d){
    var i=0;function anim(el){el.classList.add('in');el.style.animationDelay=(i++*70)+'ms';return el}
    app.innerHTML='';
    app.appendChild($('<div class="top"><a class="back" href="club.html#dueno">‹ Paradise Owner</a><span></span></div>'));
    if(!d){
      app.appendChild(anim($('<div class="hd"><img src="IMG_0623.png" onerror="this.src=\'logo-dorado.png\'" alt="Paradise Pop Corn"><div class="ttl">REPORTE DEL JEFE</div></div>')));
      app.appendChild(anim($('<div class="empty"><div class="e">🔔</div><b>Todavía no hay reportes</b><span>Te llegan solitos a las <b>2:00 p.m.</b> (lo que vendiste ayer) y a las <b>8:30 p.m.</b> (lo que llevas hoy). Toca la notificación para verlo aquí.</span></div>')));
      app.appendChild($('<a class="cta" href="club.html#dueno">Abrir Paradise Owner</a>'));
      return;
    }
    var ayer=d.c==='ayer';
    app.appendChild(anim($('<div class="hd"><img src="IMG_0623.png" onerror="this.src=\'logo-dorado.png\'" alt="Paradise Pop Corn"><div class="ttl">REPORTE DEL JEFE</div><div class="dt">'+esc(cap(d.w))+' '+esc(fl(d.f))+'</div></div>')));
    var vs='';
    if(d.p>0&&d.t>0){var p=Math.round((d.t-d.p)/d.p*100);vs=(p>=0?'▲ ':'▼ ')+Math.abs(p)+'% vs. el '+d.w+' pasado'}
    var hero=anim($('<div class="hero"><div class="k">'+(ayer?'VENDISTE AYER':'LLEVAS HOY')+'</div><div class="v">$0</div>'+(vs?'<span class="pill">'+esc(vs)+'</span>':'')+'</div>'));
    app.appendChild(hero);contar(hero.querySelector('.v'),d.t);
    var s=d.s||[],mej=s[0];
    var row=anim($('<div class="row"></div>'));
    row.appendChild($('<div class="box"><div class="k">SELLOS</div><div class="v">'+(+d.se||0)+'</div><div class="s">'+(+d.nu||0)+((+d.nu)===1?' cliente nuevo':' clientes nuevos')+'</div></div>'));
    row.appendChild($('<div class="box"><div class="k">MEJOR SUCURSAL</div><div class="v'+(mej?(mej[0].length>13?' xs':mej[0].length>6?' sm':''):'')+'">'+esc(mej?mej[0]:'—')+'</div><div class="s">'+(mej?din(mej[1])+' '+(ayer?'ayer':'hoy'):'sin cortes')+'</div></div>'));
    app.appendChild(row);
    var c=anim($('<div class="card"><h3>Por sucursal</h3></div>')),max=mej?mej[1]:1;
    if(s.length){s.forEach(function(x,k){var r=$('<div class="suc"><div style="flex:1;min-width:0"><span>'+(k===0?'👑 ':'')+esc(x[0])+'</span><div class="bar"></div></div><b>'+din(x[1])+'</b></div>');c.appendChild(r);
      setTimeout(function(){r.querySelector('.bar').style.width=Math.max(4,Math.round(x[1]/max*100))+'%'},350+k*90)})}
    else c.appendChild($('<div class="none">Todavía no registras el corte de '+(ayer?'ayer':'hoy')+'.</div>'));
    app.appendChild(c);
    var mc=anim($('<div class="card" style="border-radius:20px;padding:16px"><div class="mes"><div><div class="k">LLEVAS EN '+esc(String(d.mn||'').toUpperCase())+'</div><div class="v">$0</div></div>'+(d.me?'<div class="p">'+(+d.pc||0)+'%</div>':'')+'</div></div>'));
    if(d.me){mc.appendChild($('<div class="prog"><i></i></div>'));
      mc.appendChild($('<div class="ln">Meta: '+din(d.me)+(d.fa>0?' · faltan <b>'+din(d.fa)+'</b> en '+(+d.dq||1)+' días (≈ '+din(d.pd)+' diarios)':' · <b style="color:var(--g)">¡meta cumplida! 🎉</b>')+'</div>'));
      setTimeout(function(){mc.querySelector('.prog i').style.width=Math.min(100,+d.pc||0)+'%'},60)}
    mc.appendChild($('<div class="ln">Promedio: '+din(d.pr)+' por día'+(d.md?' · Mejor día: '+esc(fl(d.md))+' ('+din(d.mm)+')':'')+'</div>'));
    app.appendChild(mc);contar(mc.querySelector('.mes .v'),d.tm);
    app.appendChild(anim($('<a class="cta" href="club.html#dueno">Abrir Paradise Owner</a>')));
    if(lista.length>1){
      var h=anim($('<div class="hist"><h4>REPORTES ANTERIORES</h4><div class="chips"></div></div>')),ch=h.querySelector('.chips');
      lista.forEach(function(r){var b=$('<button class="chip" type="button"></button>');
        b.textContent=(r.c==='ayer'?'2:00 · ':'8:30 · ')+cap(r.w).slice(0,3)+' '+(+r.f.slice(8))+' · '+din(r.t);
        b.setAttribute('aria-pressed',r===d?'true':'false');b.addEventListener('click',function(){pintar(r);scrollTo(0,0)});ch.appendChild(b)});
      app.appendChild(h);
    }
    app.appendChild($('<div class="foot">Resumen automático de <b>Paradise Pop Corn</b> · Sabor fuera de serie</div>'));
  }
  pintar(nuevo&&nuevo.f?nuevo:(lista[0]||null));
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
