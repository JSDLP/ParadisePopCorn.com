<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>Paradise Pop Corn · Sin conexión</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden}
*{box-sizing:border-box}
body{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none;display:flex;align-items:center;justify-content:center}
.scene.on{opacity:1;pointer-events:auto}
.fit{position:relative;width:390px;height:844px;flex:none;transform-origin:center center}
.ab{position:absolute}
.rays{position:absolute;left:50%;top:430px;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;
 background:repeating-conic-gradient(from 0deg,var(--ray) 0deg 7deg,transparent 7deg 15deg);
 -webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);
 animation:spin 60s linear infinite}
.dots{position:fixed;inset:0;background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:12px 12px;
 -webkit-mask:linear-gradient(180deg,transparent 0%,#000 70%);mask:linear-gradient(180deg,transparent 0%,#000 70%);opacity:.5}
.glow{position:absolute;left:50%;top:420px;width:480px;height:480px;margin:-240px 0 0 -240px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 65%);animation:pulse 4s ease-in-out infinite}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%);pointer-events:none}
.prop{position:absolute;filter:drop-shadow(0 14px 16px rgba(0,0,0,.45))}
.k{animation:drift var(--d,7s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.col{position:relative;height:844px;display:flex;flex-direction:column;align-items:center}
.logo{width:178px;margin-top:34px;filter:drop-shadow(0 0 18px rgba(255,201,60,.45)) drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:7px 14px 7px 12px;border-radius:999px;background:rgba(0,0,0,.55);
 border:1.5px solid rgba(255,201,60,.7);font-size:12px;font-weight:800;letter-spacing:2.4px;color:#FFC93C;box-shadow:0 0 18px rgba(255,201,60,.25)}
.badge i{width:8px;height:8px;border-radius:50%;background:#FF3B55;box-shadow:0 0 10px #FF3B55;animation:blink 1.4s infinite}
.stage{position:relative;width:390px;height:330px;margin-top:6px}
.t{font-size:34px;font-weight:800;line-height:.98;letter-spacing:-1px;padding:0 18px;text-align:center;text-transform:uppercase;
 text-shadow:0 4px 0 #3A0606,0 7px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.4)}
.t b{color:#FFC93C;font-weight:800}
.s{max-width:320px;font-size:15px;line-height:1.38;text-align:center;margin-top:12px;font-weight:600;color:rgba(255,255,255,.88);text-shadow:0 2px 6px rgba(0,0,0,.6)}
.ft{position:absolute;bottom:26px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.load{display:flex;gap:9px}
.load img{width:22px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));animation:hop 1.2s ease-in-out infinite}
.load img:nth-child(2){animation-delay:.15s}.load img:nth-child(3){animation-delay:.3s}
.jgrow{display:flex;align-items:center;gap:14px}
.jgrow span{width:56px;height:1.5px;background:linear-gradient(90deg,transparent,rgba(255,201,60,.8))}
.jgrow span:last-child{background:linear-gradient(270deg,transparent,rgba(255,201,60,.8))}
.jg{height:54px;filter:drop-shadow(0 0 10px rgba(255,201,60,.5))}
.retry{margin-top:12px;font:inherit;font-size:14px;font-weight:800;letter-spacing:1px;color:#FFC93C;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,201,60,.6);
 border-radius:999px;min-height:44px;padding:0 22px;cursor:pointer}
.zz{font-weight:800;color:#FFC93C;text-shadow:0 4px 0 #3A2400,0 0 18px rgba(255,201,60,.6);animation:zfloat 3s ease-in-out infinite}
.breathe{animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 90%}
.star{animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.beam{animation:flicker 2.6s ease-in-out infinite}
.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 20deg))}}
@keyframes zfloat{0%{opacity:0;transform:translate(0,10px) scale(.8)}25%{opacity:1}100%{opacity:0;transform:translate(26px,-46px) scale(1.15)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035,1.05)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes flicker{0%,100%{opacity:.08}45%{opacity:.13}50%{opacity:.06}55%{opacity:.12}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  var scenes=[document.getElementById('s-siesta'),document.getElementById('s-cine')];
  var i=0;
  try{ i=(parseInt(localStorage.getItem('pp-offline')||'0',10)+1)%2; localStorage.setItem('pp-offline',String(i)); }catch(e){ i=Math.floor(Math.random()*2); }
  function fit(){
    var s=Math.min(window.innerWidth/390,window.innerHeight/844);
    document.querySelectorAll('.fit').forEach(function(el){ el.style.transform='scale('+s+')'; });
  }
  function show(n){ scenes.forEach(function(sc,k){ sc.classList.toggle('on',k===n); }); }
  fit(); show(i);
  window.addEventListener('resize',fit);
  setInterval(function(){ i=(i+1)%2; show(i); },9000);
  function retry(){ location.reload(); }
  document.querySelectorAll('[data-retry]').forEach(function(b){ b.addEventListener('click',retry); });
  window.addEventListener('online',function(){ setTimeout(retry,600); });
  setInterval(function(){ if(navigator.onLine){ fetch('./',{method:'HEAD',cache:'no-store'}).then(retry).catch(function(){}); } },8000);
})();
</script>
