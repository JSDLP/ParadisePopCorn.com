<style>
:root{--cream:#fff1e6;--y:#ffc83d;--k:#1a0203;--red:#d10f1f;--sal:#c9740a;--car:#d10f1f;--gou:#6b2a9e}
*,*::before,*::after{box-sizing:border-box}
html{background:#000}
body{margin:0;background:#000;font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;color:var(--cream);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,a,input{font-family:inherit}
.pg{display:block;background:#000}

/* ===== Fondo: igual al sitio ===== */
.cover{position:relative;margin:0;width:100%;min-height:100vh;min-height:100svh;
  background:linear-gradient(180deg,#000 0%,#000 11%,#5a0000 27%,#b80000 43%,#ff0000 62.5%,#ff1a1a 100%);
  background-size:100% 160%;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;
  gap:clamp(14px,3.5vw,22px);padding:clamp(22px,5vw,40px) clamp(14px,4vw,32px);overflow:hidden;
  animation:rise 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{background-position:0 100%}to{background-position:0 0}}
.vine{position:absolute;z-index:1;top:-2%;height:104%;width:clamp(90px,24vw,150px);pointer-events:none;transform-origin:50% 0;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));animation:sway var(--sd,5s) ease-in-out infinite alternate}
.vine svg{display:block;width:100%;height:100%;overflow:visible}
.vl{left:-3%;--s:1;--sd:5.5s}
.vr{right:-3%;--s:-1;--sd:6.5s;animation-delay:-2s}
@keyframes sway{from{transform:scaleX(var(--s)) rotate(-4deg)}to{transform:scaleX(var(--s)) rotate(4deg)}}
.lf{transform-origin:0 0;animation:flutter var(--du,3s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes flutter{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.fly{position:absolute;z-index:2;aspect-ratio:var(--ar);background:center/contain no-repeat;pointer-events:none;
  left:var(--x);top:var(--y);width:min(var(--w),240px);filter:blur(var(--b,0px)) drop-shadow(0 10px 14px rgba(0,0,0,.45));
  transform:rotate(var(--r));animation:drift var(--d,5s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes drift{0%{transform:translate(0,0) rotate(var(--r))}50%{transform:translate(var(--dx),calc(var(--dy)*-1)) rotate(calc(var(--r) + var(--rr)))}100%{transform:translate(0,0) rotate(var(--r))}}
.mant{background-image:url(img-29791f2f76.webp);--ar:300/397}
.cara{background-image:url(img-4e3ec123fc.webp);--ar:300/423}
.buck{background-image:url(img-1d7713b02b.webp);--ar:380/447}
.ker{background-image:url(img-3054f35101.webp);--ar:260/229}
.fly.ker{filter:brightness(var(--br,1)) sepia(var(--se,0)) saturate(var(--sa,1)) drop-shadow(0 8px 10px rgba(0,0,0,.35)) drop-shadow(0 0 14px rgba(255,90,50,.28)) blur(var(--b,0px));
  transform:rotate(var(--r)) scaleX(var(--s,1));animation:float var(--d,7s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes float{from{transform:translate(0,0) rotate(var(--r)) scaleX(var(--s,1))}to{transform:translate(var(--dx,8px),-18px) rotate(calc(var(--r) + var(--dr,12deg))) scaleX(var(--s,1))}}

.top,.logo,.intro,.chips,.stagewrap,.spin,.result,.bottom,.back{position:relative;z-index:3}
.top{align-self:stretch;font-weight:800;font-size:clamp(30px,8.5vw,52px);letter-spacing:-.02em;line-height:1;text-align:center}
.logo{width:min(62%,300px);height:auto;object-fit:contain;mix-blend-mode:screen;margin:-6px 0 -10px}
.intro{margin:0;text-align:center;font-weight:600;font-size:clamp(17px,4.6vw,22px);line-height:1.25;max-width:26ch;text-shadow:0 2px 10px rgba(110,0,0,.5)}
.intro b{color:var(--y);font-weight:800}

/* ===== Filtros ===== */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{border:2px solid rgba(255,241,230,.55);background:rgba(0,0,0,.35);color:var(--cream);font-weight:800;font-size:14px;line-height:1;
  padding:10px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,background .15s}
.chip .dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff}
.chip[aria-pressed="true"]{background:var(--cream);color:#2a0606;border-color:var(--cream)}
.chip:hover{transform:translateY(-1px)}
.chip:disabled{opacity:.5;cursor:default;transform:none}

/* ===== Ruleta ===== */
.stagewrap{width:min(100%,560px);margin-top:4px}
.wheelbox{position:relative;width:100%;aspect-ratio:1}
.wheelbox svg{display:block;width:100%;height:100%;overflow:visible}
#rotor{will-change:transform}
.slice-t{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:800;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:2px}
.bulb{fill:#ffd34d;animation:blink 1.2s steps(1) infinite}
.bulb.b2{animation-delay:-.6s}
@keyframes blink{0%{fill:#ffd34d;filter:url(#glow)}50%{fill:#7a4b00;filter:none}}
.spinning .bulb{animation-duration:.3s}
#pointer{transform-origin:300px 52px;transform-box:view-box}
#pointer.tick{animation:tick .12s ease-out}
@keyframes tick{0%{transform:rotate(0)}40%{transform:rotate(-16deg)}100%{transform:rotate(0)}}
.hub{cursor:pointer}

.popsbox{position:absolute;z-index:5;right:-4%;bottom:-6%;width:clamp(74px,21vw,118px);animation:popsbob 3.2s ease-in-out infinite alternate;transform-origin:50% 100%}
.popsbox img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
@keyframes popsbob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
.popsbubble{position:absolute;right:8%;top:-34px;white-space:nowrap;background:var(--y);color:#2a0606;font-weight:800;font-size:13px;line-height:1;padding:7px 10px;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:popsbub 1.6s ease-in-out infinite alternate}
.popsbubble::after{content:"";position:absolute;right:22px;bottom:-6px;border:6px solid transparent;border-top-color:var(--y);border-bottom:0}
@keyframes popsbub{from{transform:translateY(0)}to{transform:translateY(-4px)}}

/* ===== Botón ===== */
.spin{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;background:var(--y);color:var(--k);font-weight:800;
  font-size:clamp(20px,5.6vw,26px);letter-spacing:-.01em;padding:16px 34px;border-radius:999px;
  box-shadow:0 6px 0 var(--k),0 12px 24px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s}
.spin:hover{transform:translateY(-2px) scale(1.03)}
.spin:active{transform:translateY(5px);box-shadow:0 1px 0 var(--k),0 4px 10px rgba(0,0,0,.4)}
.spin:disabled{cursor:default;opacity:.8;transform:none}
.spin svg{width:26px;height:26px}

/* ===== Resultado ===== */
.result{width:100%;max-width:460px;background:var(--cream);color:#2a0606;border-radius:22px;overflow:hidden;
  box-shadow:0 14px 30px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.4);display:none}
.result.show{display:block;animation:popin .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.r-awn{height:26px;background:repeating-linear-gradient(90deg,var(--red) 0 26px,var(--cream) 26px 52px);border-bottom:3px solid #2a0306}
.r-head{display:flex;align-items:center;gap:10px;background:var(--c);color:#fff;padding:10px 16px;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.r-head .ico{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
.r-body{padding:16px 18px 20px;text-align:center}
.r-kicker{margin:0;font-weight:800;font-size:clamp(18px,5vw,22px);color:var(--c)}
.r-flavor{margin:2px 0 6px;font-weight:800;font-size:clamp(38px,11vw,58px);line-height:.95;letter-spacing:-.035em}
.r-price{margin:0 0 4px;font-weight:600;font-size:16px}
.r-promo{display:none;margin:8px auto 0;background:var(--red);color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;width:max-content;max-width:100%}
.r-promo.show{display:block}
.r-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.r-btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:16px;text-decoration:none;padding:12px 20px;border-radius:999px;cursor:pointer;border:0}
.r-btn.pri{background:#25d366;color:#06240f;box-shadow:0 4px 0 #0c5a2a}
.r-btn.sec{background:transparent;color:#2a0606;border:2.5px solid #2a0606}
.r-btn svg{width:20px;height:20px}

.back{color:var(--y);font-weight:800;font-size:15px;text-decoration:none;border-bottom:2px solid currentColor;padding-bottom:2px}
.bottom{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:auto;padding-top:10px}
.bottom p{margin:0;font-weight:600;font-size:clamp(20px,5.4vw,30px);line-height:1.2;text-shadow:0 2px 10px rgba(110,0,0,.5)}
.bottom small{letter-spacing:.3em;text-transform:uppercase;font-size:12px;opacity:.85}

/* palomitas que caen al ganar */
.rain{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.drop{position:absolute;top:-12%;width:var(--w);aspect-ratio:260/229;background:center/contain no-repeat;animation:fall var(--d) cubic-bezier(.3,.1,.6,1) forwards;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--dx),125vh) rotate(var(--rot))}}

.cover .fly.buck{--x:76%!important;--y:74px!important;--w:24%!important}
.cover .fly.mant{--x:-7%!important;--y:150px!important;--w:22%!important}
.cover .fly.cara{--x:-8%!important;--y:66%!important;--w:22%!important}

/* ===== Contador ===== */
.counter{position:relative;z-index:3;display:inline-flex;align-items:center;gap:10px;background:rgba(26,2,3,.72);border:2px solid var(--y);
  border-radius:999px;padding:8px 18px 8px 10px;font-weight:600;font-size:clamp(14px,3.9vw,16px);box-shadow:0 8px 18px rgba(0,0,0,.35);margin-top:-4px}
.counter .c-ico{width:34px;height:34px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:18px;flex:none}
.counter b{font-weight:800;color:var(--y);font-size:1.35em;font-variant-numeric:tabular-nums;display:inline-block}
.counter b.bump{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){.cover,.fly,.vine,.lf,.popsbox,.popsbubble,.bulb,.counter b.bump{animation:none}}
</style>

        <image href="img-0824a8efb1.webp" x="250" y="250" width="100" height="112" clip-path="url(#hubclip)" preserveAspectRatio="xMidYMin meet"/>
      </g>
      <g id="pointer">
        <path d="M300 74 L276 22 Q300 6 324 22 Z" fill="#ffc83d" stroke="#1a0203" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="300" cy="30" r="7" fill="#d10f1f" stroke="#1a0203" stroke-width="3"/>

    <div class="popsbox" aria-hidden="true"><span class="popsbubble" id="bubble">¡Gírala!</span><img alt="" src="img-0824a8efb1.webp"></div>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
  <span id="spinlbl">¡Girar!</span>

<div class="counter" id="counter" aria-live="polite"><span class="c-ico" aria-hidden="true">🍿</span><span>La ruleta se ha girado <b id="count">0</b> <span id="countWord">veces</span></span></div>

<section class="result" id="result" aria-live="polite">

    <p class="r-flavor" id="rFlavor">Sabor!</p>

    <div class="r-btns">
      <a class="r-btn pri" id="rOrder" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>
        Pedir este sabor</a>
      <button class="r-btn sec" id="rAgain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>

</main></section>

<script>
(function(){
  var CATS={
    sal:{name:"Saladas y Tradicionales",ico:"🧂",price:25,cols:["#c9740a","#e8902a","#a85c05","#f0a43c"],
      list:["Takis Fuego","Takis Azul","Chips Fuego","Mantequilla","Limón y Sal","Limón y Chile","Queso","Pizzerola","Salsas Negras","Churrumaíz","Esquites","Jalapeño","Ruffles","Queso Jalapeño"]},
    car:{name:"Caramelo",ico:"🍬",price:35,cols:["#d10f1f","#f0333f","#a50b18","#ff5a5f"],
      list:["Tutti Frutti","Naranja","Cereza","Fresa","Manzana Verde","Mora Azul","Mango","Uva","Sandía","Chicle"]},
    gou:{name:"Gourmet",ico:"👨‍🍳",price:35,cols:["#6b2a9e","#8a3fc4","#55207e","#a35ad8"],
      list:["Piña Colada","Chocolate Abuelita","Chocoreta","Pica Fresa","Mango Habanero","Unicornio","Habanero"]}
  };
  var WA="525523386765", NS="http://www.w3.org/2000/svg", C=300, R=250;
  var slicesG=document.getElementById("slices"), rotor=document.getElementById("rotor"),
      bulbsG=document.getElementById("bulbs"), pointer=document.getElementById("pointer"),
      box=document.getElementById("wheelbox"), spinBtn=document.getElementById("spin"),
      result=document.getElementById("result"), bubble=document.getElementById("bubble");
  var items=[], angle=0, spinning=false, current="all";
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}
  function pt(r,deg){var a=(deg-90)*Math.PI/180;return [C+r*Math.cos(a),C+r*Math.sin(a)]}

  function build(cat){
    items=[];
    ["sal","car","gou"].forEach(function(k){
      if(cat!=="all"&&cat!==k)return;
      CATS[k].list.forEach(function(f,i){items.push({name:f,cat:k,col:CATS[k].cols[i%(cat==="all"?2:4)]})});
    });
    while(slicesG.firstChild)slicesG.removeChild(slicesG.firstChild);
    var n=items.length, step=360/n;
    items.forEach(function(it,i){
      var a0=i*step,a1=(i+1)*step,p0=pt(R,a0),p1=pt(R,a1);
      slicesG.appendChild(el("path",{d:"M"+C+" "+C+"L"+p0[0]+" "+p0[1]+"A"+R+" "+R+" 0 "+(step>180?1:0)+" 1 "+p1[0]+" "+p1[1]+"Z",fill:it.col,stroke:"#fff1e6","stroke-width":n>20?1.5:2.5}));
      var mid=a0+step/2, fs=n>20?(it.name.length>15?13:15):(it.name.length>15?18:21);
      if(n<=10)fs=Math.min(fs+3,24);
      var t=el("text",{x:C+R-14,y:C,"class":"slice-t","font-size":fs,"text-anchor":"end","dominant-baseline":"central",
        transform:"rotate("+(mid-90)+" "+C+" "+C+")"});
      t.textContent=it.name; slicesG.appendChild(t);
    });
    // focos del borde
    while(bulbsG.firstChild)bulbsG.removeChild(bulbsG.firstChild);
    var nb=Math.max(24,Math.min(36,n));
    for(var b=0;b<nb;b++){var p=pt(271,b*360/nb);bulbsG.appendChild(el("circle",{cx:p[0],cy:p[1],r:7,"class":"bulb"+(b%2?" b2":"")}))}
  }

  var KEY="ppc-ruleta-giros", spins=0;
  try{spins=parseInt(localStorage.getItem(KEY),10)||0}catch(e){}
  function showCount(bump){
    var b=document.getElementById("count");
    b.textContent=spins.toLocaleString("es-MX");
    document.getElementById("countWord").textContent=spins===1?"vez":"veces";
    if(bump){b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
  }
  function addSpin(){spins++;try{localStorage.setItem(KEY,String(spins))}catch(e){}showCount(true)}

  function setRot(a){rotor.setAttribute("transform","rotate("+a+" "+C+" "+C+")")}

  function spin(){
    if(spinning)return;
    spinning=true; spinBtn.disabled=true; document.querySelectorAll(".chip").forEach(function(c){c.disabled=true});
    document.getElementById("spinlbl").textContent="Girando…"; bubble.textContent="¡Suerte!";
    result.classList.remove("show"); box.classList.add("spinning"); addSpin();
    var n=items.length, step=360/n, pick=Math.floor(Math.random()*n);
    var jitter=(Math.random()-.5)*step*.7;
    // queremos que el centro de la rebanada quede arriba (0°)
    var targetMod=((360-(pick*step+step/2)+jitter)%360+360)%360;
    var start=angle, base=start-(start%360);
    var end=base+360*(reduce?1:6+Math.floor(Math.random()*3))+targetMod;
    if(end-start<720&&!reduce)end+=360;
    var dur=reduce?600:5200+Math.random()*900, t0=null, lastSlice=null;
    function frame(ts){
      if(!t0)t0=ts;
      var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,4);
      angle=start+(end-start)*e; setRot(angle);
      var under=Math.floor((((360-angle%360)%360))/step);
      if(under!==lastSlice){lastSlice=under;pointer.classList.remove("tick");void pointer.getBBox();pointer.classList.add("tick")}
      if(p<1)requestAnimationFrame(frame); else done(items[pick]);
    }
    requestAnimationFrame(frame);
  }

  function done(it){
    spinning=false; spinBtn.disabled=false; box.classList.remove("spinning");
    document.querySelectorAll(".chip").forEach(function(c){c.disabled=false});
    document.getElementById("spinlbl").textContent="¡Girar otra vez!"; bubble.textContent="¡Buena elección!";
    var c=CATS[it.cat];
    result.style.setProperty("--c",c.cols[0]);
    document.getElementById("rIco").textContent=c.ico;
    document.getElementById("rCat").textContent=c.name;
    document.getElementById("rFlavor").textContent=it.name+"!";
    document.getElementById("rPrice").textContent="Desde $"+c.price+" · Chico, Mediano, Grande o Jumbo";
    document.getElementById("rPromo").classList.toggle("show",it.name==="Mantequilla");
    var msg="Hola, la ruleta de Paradise Pop Corn me eligió el sabor "+it.name+" ("+c.name+"). ¡Quiero hacer un pedido!";
    document.getElementById("rOrder").href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
    result.classList.add("show");
    if(navigator.vibrate)try{navigator.vibrate([30,40,60])}catch(e){}
    rain();
    setTimeout(function(){result.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"})},350);
  }

  function rain(){
    if(reduce)return;
    var r=document.getElementById("rain");
    for(var i=0;i<22;i++){
      var d=document.createElement("div"); d.className="drop ker";
      d.style.cssText="left:"+(Math.random()*100)+"%;--w:"+(24+Math.random()*34)+"px;--d:"+(2.2+Math.random()*1.8)+"s;--dl:"+(Math.random()*.6)+"s;--dx:"+((Math.random()-.5)*120)+"px;--rot:"+((Math.random()-.5)*720)+"deg";
      r.appendChild(d);
    }
    setTimeout(function(){r.innerHTML=""},4800);
  }

  spinBtn.addEventListener("click",spin);
  document.getElementById("hub").addEventListener("click",spin);
  document.getElementById("rAgain").addEventListener("click",function(){window.scrollTo({top:box.getBoundingClientRect().top+scrollY-80,behavior:reduce?"auto":"smooth"});setTimeout(spin,reduce?0:450)});
  document.querySelectorAll(".chip").forEach(function(ch){
    ch.addEventListener("click",function(){
      if(spinning)return;
      current=ch.dataset.cat;
      document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c===ch?"true":"false")});
      angle=0; setRot(0); build(current); result.classList.remove("show");
      document.getElementById("spinlbl").textContent="¡Girar!"; bubble.textContent="¡Gírala!";
    });
  });
  build("all"); setRot(0); showCount(false);
})();
</script>
</body>
